[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "se373-flight-agent"
version = "0.1.0"
description = "BTVN#3: harness for a mock flight-booking agent"
requires-python = ">=3.14"
dependencies = [
  "langchain==1.4.3",
  "langgraph==1.2.12",
  "langchain-openai==1.6.7",
  "pydantic==2.13.5",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["flight_agent*"]
